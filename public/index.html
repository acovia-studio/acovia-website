  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");

      // 兜底：脚本出错或资源一直不返回时，页面也要放出来
      window.setTimeout(function () { root.classList.add("is-ready"); }, 8000);

      function reveal() {
        root.classList.add("is-ready");
      }

      function waitForAssets() {
        var fonts = document.fonts ? document.fonts.ready.catch(function () {}) : Promise.resolve();
        var loaded = new Promise(function (resolve) {
          if (document.readyState === "complete") resolve();
          else window.addEventListener("load", resolve, { once: true });
        });
        var timeout = new Promise(function (resolve) {
          window.setTimeout(resolve, 6000);
        });
        Promise.race([Promise.all([fonts, loaded]), timeout]).then(reveal, reveal);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", waitForAssets, { once: true });
      } else {
        waitForAssets();
      }
    })();
  </script>
